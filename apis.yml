aid: redwood-materials
name: Redwood Materials
description: 'Redwood Materials is a Carson City, Nevada battery materials company founded
  in 2017 by former Tesla CTO JB Straubel. It operates a domestic circular supply chain
  for lithium-ion batteries: collecting and recycling end-of-life EV, consumer, micromobility
  and stationary-storage batteries, refining the recovered lithium, nickel, cobalt and
  copper, and remanufacturing anode copper foil and cathode active material for North
  American cell producers. Through Redwood Energy it also deploys second-life battery
  energy storage systems for data centers and the grid. Redwood runs the Tahoe Campus
  in Northern Nevada, the Carolina Campus outside Charleston, South Carolina, and an
  R&D center in San Francisco, and works with Panasonic, Toyota, GM, BMW, VW/Audi, Rivian,
  Caterpillar, Isuzu and Lime. Redwood publishes no public developer API, OpenAPI, SDK
  or MCP server; its only machine-facing surface is a gated AWS Cognito partner portal
  used by automotive dismantlers to price and sell end-of-life battery packs.'
